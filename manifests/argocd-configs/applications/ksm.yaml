metadata:
  name: ksm

query_params:
  upsert: true

spec:
  project: cloudops
  source:
    chart: kube-state-metrics
    repoURL: "https://prometheus-community.github.io/helm-charts"
    targetRevision: 5.33.0
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
        - CreateNamespace=true
