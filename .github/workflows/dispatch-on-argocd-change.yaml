name: Dispatch on Argocd YAML file changes


on:
  pull_request_target:
    types: [opened, edited, reopened, assigned, unlocked, synchronize]
    branches: 
      - cloudops/**
  push:
    branches:
      - 'cloudops/**'
    # Adjust these paths to your tfvars and values directories
    paths:
      - 'manifests/argocd-configs/**'

jobs:
  detect-change:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.argocd-target.outputs.services }}
      environments: ${{ steps.argocd-target.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-yamls
        uses: tj-actions/changed-files@v46
        with:
          files_yaml: |
            project:
              - manifests/argocd-configs/projects/*.yaml
              - manifests/argocd-configs/project.yaml
            application:
              - manifests/argocd-configs/applications/*.yaml
              - manifests/argocd-configs/application.yaml
            repository:
              - manifests/argocd-configs/repositories/*.yaml
              - manifests/argocd-configs/repository.yaml

      - name: Test outputs
        id: argocd-target
        run: |
          changed_keys=$(echo "${{ steps.changed-yamls.outputs.changed_keys }}" | jq -ac -R 'split(" ") | { types: . }')
          envs=$(jq -ac '{ "env": [ .environments | to_entries[] | select(.value.enabled == "true") | .key ] }' manifests/argocd-configs/meta.json)
          echo "environments=$envs" >> $GITHUB_OUTPUT
          echo "services=$changed_keys" >> $GITHUB_OUTPUT
          
  dispatch:
    runs-on: ubuntu-latest
    needs: detect-change
    strategy:
      matrix:
        env: ${{ fromJSON(needs.detect-change.outputs.environments).env }}
        service: ${{ fromJSON(needs.detect-change.outputs.services).types }}
    steps:
      - name: Handle Pull Request Events
        if: github.event_name == 'pull_request_target'
        id: event-type-pr
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
      
      - name: Handle Push Events
        if: github.event_name == 'push'
        id: event-type-push
        run: |
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          
      - name: Send repository dispatch to workflows repo
        # if: steps.changed-.outputs.dev_only_changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          # Use a PAT stored in secrets for cross-repo dispatch
          token: ${{ secrets.GH_PAT }}
          repository: ${{ vars.TF_WORKFLOW_REPO }}
          event-type: service-changed
          client-payload: |
            {
              "target_branch": "${{ github.ref_name || github.event.pull_request.head.ref }}",
              "environment": "${{ matrix.env }}",
              "event_name": "${{ github.event_name }}",
              "service": "${{ matrix.service }}",
              "commit_sha": "${{ steps.event-type-push.outputs.sha }}",
              "pr_number": "${{ steps.event-type-pr.outputs.pr_number }}"
            }


